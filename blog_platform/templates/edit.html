{% extends "base.html" %}

{% block title %}Edit {{ post['title'] }} - Blogging Platform{% endblock %}

{% block content %}
  <h1>Edit Post</h1>
  <form method="post" class="post-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ post['title'] }}" required>

    <label for="body_markdown">Body (Markdown)</label>
    <textarea id="body_markdown" name="body_markdown" rows="12" required>{{ post['body_markdown'] }}</textarea>

    <label class="checkbox-label">
      <input type="checkbox" name="published" {% if post['published'] %}checked{% endif %}>
      Published
    </label>

    <button type="submit">Save Changes</button>
  </form>
{% endblock %}
